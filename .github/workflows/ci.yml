# The T0 job matrix. Task REPO-6 owns this file and is the only task that edits
# one.
#
# THIS MATRIX IS T0 ONLY, AND IT ALWAYS WILL BE. No T1 job, no T2 job and no
# integer-comparison job runs here. All three need a firmware byte, and no
# public repository may hold a credential that could fetch one. Those jobs run
# inside the private artifact repository instead. T0 only is what lets every job
# here run on a pull request from a fork.
#
# EVERY PER-TRACK UNIT IS A REUSABLE WORKFLOW AND IT CONTRIBUTES A JOB.
# GitHub resolves a local reusable workflow only as `./.github/workflows/<file>`.
# A file under `.github/jobs/` is not resolvable by `uses:` and never runs.
# Nothing outside a callee workflow can insert a step into it, so each track
# declares one job in its own file and adds its steps there.
#
# A merge of every track's branch touches this file in ZERO places.

# CI is manual. Automatic push/pull_request runs were removed because the
# three-OS matrix cost hours of runner time per push. Start a run from the
# Actions tab or with `gh workflow run`.

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # THE T0 NAME PREFIXES THIS REPOSITORY REGISTERS.
  #
  # `t0_` is NOT the tier marker. A tier is a property of a check AT RUN TIME
  # -- T0 is the set of checks that run with no firmware byte -- and it is not
  # a property of the name. The Nim-side suites this repository registers carry
  # a bare `t_` prefix with no tier digit, so a `^t0_` pattern alone leaves them
  # unselected while still matching enough that `--no-tests=error` stays silent.
  #
  # NO `t1_` OR `t2_oracle` ALTERNATIVE MAY EVER BE ADDED HERE. Both are
  # firmware-gated, and the matrix at the top of this file is T0 only.
  T0_PATTERN: '^t0_|^t_'

jobs:
  build-and-t0:
    name: build-and-t0
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-arm64 is EXCLUDED here, not unsupported. macOS/arm64 is the
          # development platform and is exercised locally. It left CI after
          # gearmulator's inherited CMake run 31033322092, where the macOS jobs
          # were CANCELLED at >=4h 32m without completing, against 19m 46s for
          # the comparable Ubuntu job: >=13.8x, and unbounded, because a
          # cancelled job gives a lower bound and not a duration. That run
          # measures a CMake build in another repository. No equivalent
          # measurement exists for this repository's own build.
          # Uncomment the two lines below to restore the macOS job.
          # - target: macos-arm64
          #   runs-on: macos-14
          - target: linux-x86-64
            runs-on: ubuntu-latest
          - target: windows-x86-64
            runs-on: windows-2022
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CTest 3.20 is the floor because `--no-tests=error` is a CTest flag and
      # the earlier releases do not carry it. Without that flag every `-R` check
      # in this project passes against no code at all.
      - name: Require CMake and CTest 3.20 or newer
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ctest --version
          have=$(cmake --version | head -1 | grep -Eo '[0-9]+\.[0-9]+' | head -1)
          major=${have%%.*}
          minor=${have##*.}
          if [ "${major}" -lt 3 ] || { [ "${major}" -eq 3 ] && [ "${minor}" -lt 20 ]; }; then
            echo "FAILURE: CMake ${have} is older than the 3.20 floor."
            exit 1
          fi


      # THE NIM VERSION IS READ FROM `.nim-version` AND IS NEVER WRITTEN HERE.
      # That file is the single definition site of the pin. A version string
      # copied into this workflow would be a second definition site and the two
      # would drift.
      - name: Install the pinned Nim
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < .nim-version)
          echo "The pin recorded in .nim-version is ${version}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # choosenim's Windows binary fails on the hosted image with
            # `could not find symbol: SSL_library_init`. The official release
            # archive needs no TLS library of its own, and it is still selected
            # by the pin this file reads rather than by a version written here.
            curl -fsSL "https://nim-lang.org/download/nim-${version}_x64.zip" -o nim.zip
            unzip -q nim.zip
            echo "${PWD}/nim-${version}/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://nim-lang.org/choosenim/init.sh -o init.sh
            sh init.sh -y
            export PATH="${HOME}/.nimble/bin:${PATH}"
            choosenim "${version}"
            echo "${HOME}/.nimble/bin" >> "$GITHUB_PATH"
          fi

      - name: Confirm that the installed Nim matches the pin
        shell: bash
        run: |
          set -euo pipefail
          want=$(tr -d '[:space:]' < .nim-version)
          have=$(nim --version | head -1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "pin=${want} installed=${have}"
          if [ "${want}" != "${have}" ]; then
            echo "FAILURE: the installed Nim ${have} does not match the pin ${want}."
            exit 1
          fi

      # The cross assembler runs on the Linux job ONLY, because that is the one
      # job that regenerates the conformance corpus. A DIFFERENT ASSEMBLER
      # VERSION CAN EMIT DIFFERENT BYTES, so the version is pinned by the
      # distribution package and named in `docs/toolchain.md`. The macOS and
      # Windows jobs install no cross assembler and run the parse-and-
      # completeness half instead.
      - name: Install the pinned cross assembler
        if: matrix.target == 'linux-x86-64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu
          m68k-linux-gnu-as --version | head -1

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # THE LISTING TEXT IS THE MECHANISM AND THE EXIT CODE IS NOT.
      # `--no-tests=error` governs a test RUN. In `-N` listing mode it is inert:
      # the listing exits 0 whether or not any test matched. So this step reads
      # what the listing PRINTS.
      #
      # IT COMPARES SETS OF NAMES AND IT WRITES DOWN NO COUNT. A total is blind
      # in both of the directions that matter: a suite that stops reaching the
      # build tree still leaves a non-zero total, and whether a listed suite is
      # one any job RUNS is not a property of the listing at all.
      #
      # A HAND-WRITTEN COUNT IS NOT THE REPAIR EITHER. So both comparisons below
      # DERIVE BOTH OF THEIR SIDES, and the only roster that is typed out is the
      # exclusion roster, whose whole purpose is to be typed.
      - name: Assert that every registered test reaches the build tree and a job
        shell: bash
        run: |
          set -uo pipefail

          names() { sed -nE 's/^  Test +#[0-9]+: (.*)$/\1/p' | sort -u; }

          # Derived from the tracked CMake source. `git grep` is what keeps the
          # build tree and any untracked file out of the sweep.
          registered=$(git grep -hoE 'add_test\(NAME[[:space:]]+[A-Za-z0-9_]+' \
              -- '*.cmake' '*CMakeLists.txt' \
              | sed -E 's/.*add_test\(NAME[[:space:]]+//' | sort -u)
          # Derived from the configured build tree.
          listed=$(ctest --test-dir build -N | names)
          selected=$(ctest --test-dir build -N -R "${T0_PATTERN}" | names)

          printf 'registered in tracked source:\n%s\n\n' "${registered}"
          printf 'listed by the build tree:\n%s\n\n' "${listed}"
          printf 'selected by T0_PATTERN %s:\n%s\n\n' "${T0_PATTERN}" "${selected}"

          status=0

          # 1. Every name the source registers reaches the build tree, and the
          #    build tree lists nothing the source does not register. This is
          #    the check that sees a suite vanish.
          if [ "${registered}" != "${listed}" ]; then
            echo "FAILURE: the registration source and the build tree disagree."
            echo "registered in source but MISSING from the build tree:"
            comm -23 <(printf '%s\n' "${registered}") <(printf '%s\n' "${listed}")
            echo "listed by the build tree but registered nowhere in source:"
            comm -13 <(printf '%s\n' "${registered}") <(printf '%s\n' "${listed}")
            status=1
          fi

          # 2. Every listed name is either selected by the T0 pattern or sits on
          #    the roster below. THE ROSTER IS THE ONE THING HERE THAT IS WRITTEN
          #    DOWN RATHER THAN DERIVED, and that is the point of it: a test that
          #    neither matches the pattern nor appears here fails this step, so
          #    "this does not run in CI" has to be a sentence somebody typed.
          #
          #    `mcf5307_conformance_*` are the corpus runner's groups. They
          #    need no firmware and no cross assembler at RUN time -- the
          #    assembler regenerates the corpus, and these read the committed
          #    one -- so nothing about them is inherently T1. They are held out
          #    pending a decision about their place in this matrix, and this
          #    roster is where that open question is recorded.
          excluded=$(printf '%s\n' \
              mcf5307_conformance_all \
              mcf5307_conformance_alu \
              mcf5307_conformance_control \
              mcf5307_conformance_logic \
              mcf5307_conformance_move | sort -u)
          unselected=$(comm -23 \
              <(printf '%s\n' "${listed}") <(printf '%s\n' "${selected}"))
          if [ "${unselected}" != "${excluded}" ]; then
            echo "FAILURE: the set of tests that no job runs is not the roster."
            echo "runs in no job and is NOT on the roster:"
            comm -13 <(printf '%s\n' "${excluded}") <(printf '%s\n' "${unselected}")
            echo "on the roster but DOES run -- delete the roster entry:"
            comm -23 <(printf '%s\n' "${excluded}") <(printf '%s\n' "${unselected}")
            status=1
          fi

          exit "${status}"

      - name: Run the T0 suite
        shell: bash
        run: ctest --test-dir build --no-tests=error -R "${T0_PATTERN}" --output-on-failure

  sanitizer-t0:
    name: sanitizer-t0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build with the address and undefined sanitizers
        run: |
          set -euo pipefail
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan --parallel

      - name: Run the T0 suite under the sanitizers
        run: ctest --test-dir build-asan --no-tests=error -R "${T0_PATTERN}" --output-on-failure

  track-repo:
    uses: ./.github/workflows/track-repo.yml
    with:
      visibility: public

  track-cpu:
    uses: ./.github/workflows/track-cpu.yml
