# The cpu track's reusable workflow.
#
# A per-track unit is a reusable workflow and it contributes a JOB, not a step.
# Nothing outside a callee workflow can insert a step into it, so this track
# adds its steps inside this job, in this file, and touches `ci.yml` in zero
# places.
#
# THIS JOB ASSERTS NOTHING YET AND IT SAYS SO. It exists to give the caller a
# resolvable `uses:` reference, and to give a future step a file to live in.

name: track-cpu

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cpu-pins:
    name: cpu-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: This track has no step yet
        run: echo "track-cpu is empty. CPU-25 adds the Nim pin step."
